[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-news-api"
version = "0.1.0"
description = "Simple Naver News Search API client."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["naver_news_api*"]
